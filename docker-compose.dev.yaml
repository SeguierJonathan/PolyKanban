services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - polykanban-postgres-data:/var/lib/postgresql

  backend:
    build: ./backend-node-api
    env_file:
      - .env
    ports:
      - 3001:3001
    volumes:
      - ./backend-node-api:/app
      - /app/node_modules
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  polykanban-postgres-data:
